[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "insurer"
version = "0.1.0"
description = "A learning sandbox for an AI-native insurer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "chainladder==0.10.1",
  "PyYAML==6.0.3",
  "fastapi==0.141.0",
  "uvicorn==0.53.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
  "mypy==2.3.1",
]

[project.scripts]
insurer = "insurer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insurer"]

[tool.hatch.build.targets.wheel.force-include]
"src/insurer/schema.sql" = "insurer/schema.sql"
"products/agent_spend_cover.yaml" = "insurer/agent_spend_cover.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
